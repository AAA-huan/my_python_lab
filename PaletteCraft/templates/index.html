<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaletteCraft · 智能配色生成器</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: 'Poppins', sans-serif; color: #1a1a1a; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;
    background: var(--bg-main, linear-gradient(135deg, #f5f0eb 0%, #e8e0d8 100%));
    transition: background 0.6s ease;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1;
    background: var(--bg-overlay, transparent);
    transition: background 0.6s ease;
  }
  .container {
    width: 100%; max-width: 680px;
    background: rgba(255,255,255,var(--container-alpha, 0.7));
    backdrop-filter: blur(20px); border-radius: 20px;
    padding: 36px 32px;
    box-shadow: 0 8px 32px var(--shadow-color, rgba(0,0,0,0.06));
    transition: background 0.6s ease, box-shadow 0.6s ease;
  }
  .logo { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted, #8a7a6a); font-weight: 500; margin-bottom: 4px; transition: color 0.6s ease; }
  h1 { font-family: 'Lora', serif; font-size: 28px; font-weight: 400; margin-bottom: 4px; color: var(--text-main, #1a1a1a); transition: color 0.6s ease; }
  .subtitle { color: var(--text-muted, #8a7a6a); font-size: 13px; margin-bottom: 24px; transition: color 0.6s ease; }

  /* Color Ring */
  .ring-wrapper { display: flex; justify-content: center; margin-bottom: 28px; }
  .ring-container { position: relative; width: 200px; height: 200px; border-radius: 50%; overflow: hidden; box-shadow: 0 4px 20px var(--shadow-color, rgba(0,0,0,0.1)); transition: box-shadow 0.6s ease; }
  .ring-outer { width: 100%; height: 100%; border-radius: 50%; }
  .ring-inner {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 100px; height: 100px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.6);
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.1);
    transition: background 0.3s ease;
  }
  .ring-center-label {
    position: absolute; bottom: -28px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: var(--text-muted, #8a7a6a); white-space: nowrap;
    font-weight: 500; letter-spacing: 0.5px;
  }

  .section-title { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted, #8a7a6a); font-weight: 500; margin-bottom: 12px; margin-top: 24px; transition: color 0.6s ease; }
  .section-title:first-of-type { margin-top: 0; }
  .form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .form-group { flex: 1; min-width: 140px; }
  .form-group label { display: block; font-size: 12px; font-weight: 500; margin-bottom: 5px; color: var(--text-secondary, #555); transition: color 0.6s ease; }
  .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color, rgba(0,0,0,0.1)); border-radius: 8px; background: white; font-size: 14px; font-family: 'Poppins', sans-serif; outline: none; transition: border-color 0.15s, background 0.6s ease; }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent, #a08060); }
  .form-group input[type="color"] { height: 44px; padding: 4px; cursor: pointer; }
  .btn { padding: 10px 20px; border: 1px solid var(--border-color, rgba(0,0,0,0.1)); border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Poppins', sans-serif; transition: all 0.15s, border-color 0.6s; background: rgba(255,255,255,0.6); color: #1a1a1a; white-space: nowrap; }
  .btn:hover { background: rgba(0,0,0,0.06); border-color: rgba(0,0,0,0.2); }
  .btn-primary { background: var(--accent, #a08060); color: white; border-color: var(--accent, #a08060); transition: background 0.3s ease, border-color 0.3s ease; }
  .btn-primary:hover { filter: brightness(0.9); }
  .btn-full { width: 100%; margin-top: 8px; }

  /* Palette swatches */
  .palette { display: flex; gap: 6px; margin-top: 8px; min-height: 56px; align-items: stretch; }
  .palette .swatch { flex: 1; height: 56px; border-radius: 8px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.9); text-shadow: 0 1px 3px rgba(0,0,0,0.3); transition: transform 0.2s, flex 0.3s; cursor: pointer; position: relative; overflow: hidden; }
  .palette .swatch:hover { transform: translateY(-4px); flex: 1.15; }
  .palette .swatch .hex { position: absolute; bottom: 6px; font-size: 10px; opacity: 0.85; }
  .palette-empty { font-size: 13px; color: var(--text-muted, #8a7a6a); font-style: italic; padding: 16px 0; text-align: center; width: 100%; }
  .section-divider { height: 1px; background: var(--border-color, rgba(0,0,0,0.06)); margin: 24px 0; transition: background 0.6s ease; }

  /* File upload */
  .upload-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .file-label-wrap { position: relative; flex: 1; min-width: 160px; }
  .file-label-wrap input[type="file"] { position: absolute; opacity: 0; width: 100%; height: 100%; cursor: pointer; top: 0; left: 0; }
  .file-label { display: flex; align-items: center; gap: 6px; padding: 10px 16px; border: 1px dashed var(--border-color, rgba(0,0,0,0.15)); border-radius: 8px; font-size: 13px; color: var(--text-secondary, #555); cursor: pointer; transition: all 0.15s; }
  .file-label:hover { border-color: var(--accent, #a08060); background: rgba(160,128,96,0.04); }

  .extracted-color { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 12px; background: rgba(0,0,0,0.03); border-radius: 8px; }
  .extracted-color .preview { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--border-color, rgba(0,0,0,0.06)); }
  .extracted-color .info { font-size: 13px; flex: 1; }
  .extracted-color .info .hex-code { font-family: 'Lora', serif; font-weight: 600; }
  .status { font-size: 12px; color: var(--text-muted, #8a7a6a); margin-top: 6px; min-height: 20px; transition: color 0.6s ease; }

  @media (max-width: 480px) { .container { padding: 24px 18px; } .form-row { flex-direction: column; } }
</style>
</head>
<body>
<div class="container">
  <div class="logo">PaletteCraft</div>
  <h1>智能配色生成器</h1>
  <div class="subtitle">选择主色或上传图片，算法自动生成和谐配色方案</div>

  <!-- Color Ring Visualization -->
  <div class="ring-wrapper">
    <div class="ring-container">
      <canvas id="ringCanvas" width="200" height="200"></canvas>
      <div class="ring-inner" id="ringInner" style="background:#3A6EA5"></div>
      <div class="ring-center-label">主色 · 配色</div>
    </div>
  </div>

  <!-- Generate from color -->
  <div class="section-title">✦ 从颜色生成</div>
  <div class="form-row">
    <div class="form-group" style="flex:0 0 60px">
      <label>主色</label>
      <input type="color" id="baseColor" value="#3A6EA5">
    </div>
    <div class="form-group">
      <label>配色模式</label>
      <select id="modeSelect">
        <option value="complementary">互补色</option>
        <option value="analogous" selected>类比色</option>
        <option value="triadic">三角色</option>
      </select>
    </div>
    <div>
      <button class="btn btn-primary" id="generateBtn" style="height:44px">生成配色</button>
    </div>
  </div>
  <div class="palette" id="paletteDisplay"><div class="palette-empty">点击「生成配色」查看结果</div></div>
  <div class="status" id="generateStatus"></div>

  <div class="section-divider"></div>

  <!-- Extract from image -->
  <div class="section-title">✦ 从图片提取</div>
  <div class="upload-row">
    <div class="file-label-wrap">
      <div class="file-label" id="fileLabel">📁 选择图片文件（PNG / JPG）</div>
      <input type="file" id="imageInput" accept="image/png,image/jpeg,image/jpg">
    </div>
    <button class="btn btn-primary" id="extractBtn">提取主色</button>
  </div>
  <div id="extractResult"></div>
  <div class="status" id="extractStatus"></div>
</div>

<script>
const API_GENERATE = '/api/generate';
const API_EXTRACT = '/api/extract';

// === Color helpers ===
function hexToHSL(hex) {
  let r = parseInt(hex.slice(1,3),16) / 255;
  let g = parseInt(hex.slice(3,5),16) / 255;
  let b = parseInt(hex.slice(5,7),16) / 255;
  let max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max + min) / 2;
  if (max === min) { h = s = 0; }
  else {
    let d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
      case g: h = ((b - r) / d + 2) / 6; break;
      case b: h = ((r - g) / d + 4) / 6; break;
    }
  }
  return [h * 360, s * 100, l * 100];
}

function applyTheme(hex) {
  const [h, s, l] = hexToHSL(hex);
  const mutedL = Math.min(l + 20, 85);
  const bgH = h, bgS = Math.max(s - 40, 5), bgL = Math.min(l + 35, 92);
  const overlayH = h, overlayS = Math.max(s - 50, 3), overlayL = Math.min(l + 40, 95);
  const shadowH = h, shadowS = 15, shadowL = Math.min(l, 30);

  document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--text-main', l < 55 ? '#1a1a1a' : '#f0ece8');
  document.documentElement.style.setProperty('--text-muted', `hsl(${h}, 15%, ${mutedL}%)`);
  document.documentElement.style.setProperty('--text-secondary', `hsl(${h}, 12%, 45%)`);
  document.documentElement.style.setProperty('--border-color', `hsla(${h}, 15%, 60%, 0.18)`);
  document.documentElement.style.setProperty('--bg-main', `linear-gradient(135deg, hsl(${bgH}, ${bgS}%, ${bgL}%) 0%, hsl(${overlayH}, ${overlayS}%, ${overlayL}%) 100%)`);
  document.documentElement.style.setProperty('--shadow-color', `hsla(${shadowH}, ${shadowS}%, ${shadowL}%, 0.12)`);
  document.documentElement.style.setProperty('--container-alpha', l < 50 ? '0.85' : '0.7');
}

// === Ring visualization ===
function drawRing(baseColor, paletteColors) {
  const canvas = document.getElementById('ringCanvas');
  const ctx = canvas.getContext('2d');
  const w = 200, h = 200, cx = 100, cy = 100;
  const outerR = 98, innerR = 54;

  ctx.clearRect(0, 0, w, h);

  const colors = paletteColors && paletteColors.length ? paletteColors : [baseColor];
  const angle = 360 / colors.length;

  for (let i = 0; i < colors.length; i++) {
    const start = (i * angle - 90) * Math.PI / 180;
    const end = ((i + 1) * angle - 90) * Math.PI / 180;
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, start, end);
    ctx.arc(cx, cy, innerR, end, start, true);
    ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.fill();
  }

  // outer border
  ctx.beginPath();
  ctx.arc(cx, cy, outerR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // inner border
  ctx.beginPath();
  ctx.arc(cx, cy, innerR, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(0,0,0,0.06)';
  ctx.lineWidth = 1;
  ctx.stroke();

  document.getElementById('ringInner').style.background = baseColor;
}

// === Base color change handler ===
document.getElementById('baseColor').oninput = function() {
  applyTheme(this.value);
  drawRing(this.value, null);
};

// === Generate Palette ===
document.getElementById('generateBtn').onclick = async () => {
  const baseColor = document.getElementById('baseColor').value;
  const mode = document.getElementById('modeSelect').value;
  const status = document.getElementById('generateStatus');
  status.textContent = '生成中...';

  try {
    const res = await fetch(API_GENERATE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ color: baseColor, mode })
    });
    if (!res.ok) throw new Error('请求失败');
    const data = await res.json();
    // 过滤掉主色本身（前端处理，不涉及后端）
    const filtered = data.palette.filter(c => c.toUpperCase() !== baseColor.toUpperCase());
    renderPalette(filtered);
    drawRing(baseColor, filtered);
    status.textContent = `✅ 生成 ${filtered.length} 个配色`;
  } catch (e) {
    status.textContent = '❌ ' + e.message;
  }
};

function renderPalette(colors) {
  const el = document.getElementById('paletteDisplay');
  if (!colors || colors.length === 0) {
    el.innerHTML = '<div class="palette-empty">未生成配色</div>';
    return;
  }
  el.innerHTML = colors.map(c => {
    const textColor = isLight(c) ? 'rgba(0,0,0,0.7)' : 'rgba(255,255,255,0.9)';
    return `<div class="swatch" style="background:${c};color:${textColor}"><span class="hex">${c}</span></div>`;
  }).join('');
}

function isLight(hex) {
  const c = hex.replace('#','');
  const r = parseInt(c.substr(0,2),16);
  const g = parseInt(c.substr(2,2),16);
  const b = parseInt(c.substr(4,2),16);
  return r*0.299 + g*0.587 + b*0.114 > 160;
}

// === Extract from Image ===
document.getElementById('extractBtn').onclick = async () => {
  const fileInput = document.getElementById('imageInput');
  const file = fileInput.files[0];
  const status = document.getElementById('extractStatus');
  const result = document.getElementById('extractResult');

  if (!file) {
    status.textContent = '⚠️ 请先选择一张图片';
    return;
  }

  status.textContent = '提取中...';
  const formData = new FormData();
  formData.append('image', file);

  try {
    const res = await fetch(API_EXTRACT, { method: 'POST', body: formData });
    if (!res.ok) throw new Error('提取失败');
    const data = await res.json();
    const hex = data.color.hex;
    // 直接填入主色选择器
    document.getElementById('baseColor').value = hex;
    const evt = new Event('input', { bubbles: true });
    document.getElementById('baseColor').dispatchEvent(evt);

    result.innerHTML = `
      <div class="extracted-color">
        <div class="preview" style="background:${hex}"></div>
        <div class="info">
          主色调：<span class="hex-code">${hex}</span>
          <span style="font-size:11px;color:var(--text-muted)"> · 已自动填入</span>
        </div>
      </div>`;
    status.textContent = '✅ 提取成功，主色已填入，可选择模式后点击「生成配色」';
  } catch (e) {
    status.textContent = '❌ ' + e.message;
  }
};

document.getElementById('imageInput').onchange = function() {
  if (this.files[0]) {
    document.getElementById('fileLabel').textContent = '📁 ' + this.files[0].name;
  }
};

// === Init ===
applyTheme('#3A6EA5');
drawRing('#3A6EA5', null);
</script>
</body>
</html>
