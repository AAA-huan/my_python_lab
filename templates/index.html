<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAA·huan — 实验仓库</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07070d;
    --panel: #0e0e1a;
    --cyan: #00f0ff;
    --magenta: #ff00e0;
    --green: #33ff77;
    --amber: #ffbd2e;
    --red: #ff5f56;
    --text: #e8e8f0;
    --muted: #8b8ba3;
    --dim: #5a5a72;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; overflow-x: hidden; line-height: 1.7;
  }
  /* ===== 背景层 ===== */
  .grid-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,240,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,0,224,0.045) 1px, transparent 1px);
    background-size: 46px 46px;
    mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, #000 25%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 90% 80% at 50% 20%, #000 25%, transparent 78%);
  }
  .glow-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .glow-orbs::before, .glow-orbs::after {
    content: ''; position: absolute; border-radius: 50%; filter: blur(100px);
  }
  .glow-orbs::before { width: 440px; height: 440px; background: var(--cyan); opacity: 0.14; top: -140px; left: -100px; }
  .glow-orbs::after { width: 520px; height: 520px; background: var(--magenta); opacity: 0.12; bottom: -180px; right: -120px; }
  .scanlines::before {
    content: ''; position: fixed; inset: 0; z-index: 90; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 3px);
    opacity: 0.35;
  }
  #dust { position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: 0.7; }

  .wrap { position: relative; z-index: 5; max-width: 1140px; margin: 0 auto; padding: 0 6vw; }

  /* ===== 导航 ===== */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 0; flex-wrap: wrap; gap: 14px;
    border-bottom: 1px solid rgba(0,240,255,0.12);
  }
  .logo { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 19px; letter-spacing: 2px; }
  .logo .c1 { color: var(--cyan); text-shadow: 0 0 14px rgba(0,240,255,0.7); }
  .logo .c2 { color: var(--magenta); text-shadow: 0 0 14px rgba(255,0,224,0.7); }
  .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-links a {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--muted);
    text-decoration: none; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.09);
    border-radius: 7px; transition: all 0.25s;
  }
  .nav-links a .tilda { color: var(--cyan); }
  .nav-links a:hover { color: var(--cyan); border-color: rgba(0,240,255,0.55); box-shadow: 0 0 18px rgba(0,240,255,0.2); transform: translateY(-2px); }

  /* ===== Hero ===== */
  .hero { padding: 70px 0 44px; text-align: center; }
  .eyebrow {
    display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 12px;
    letter-spacing: 3px; color: var(--cyan);
    border: 1px solid rgba(0,240,255,0.35); border-radius: 999px;
    padding: 7px 20px; background: rgba(0,240,255,0.05);
    text-shadow: 0 0 12px rgba(0,240,255,0.6); margin-bottom: 26px;
  }
  h1 {
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif; font-weight: 900;
    font-size: clamp(38px, 7vw, 78px); line-height: 1.1; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--cyan), #a7f7ff 32%, var(--magenta) 68%, #ff9ae8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(0,240,255,0.28));
  }
  .hero .sub {
    max-width: 640px; margin: 26px auto 0; font-size: clamp(14px, 1.9vw, 16.5px);
    font-weight: 300; color: var(--muted); line-height: 2;
  }
  .hero .sub .hl { color: var(--cyan); }
  .hero .sub .hl2 { color: var(--magenta); }
  .cta-row { margin-top: 32px; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btn {
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif; font-size: 14px; letter-spacing: 2px;
    padding: 15px 34px; border-radius: 7px; text-decoration: none; transition: all 0.3s; cursor: pointer;
  }
  .btn-solid {
    color: #06060c; font-weight: 700;
    background: linear-gradient(90deg, var(--cyan), #00c8ff);
    box-shadow: 0 0 24px rgba(0,240,255,0.45);
  }
  .btn-solid:hover { transform: translateY(-3px); box-shadow: 0 0 38px rgba(0,240,255,0.7); }
  .btn-ghost {
    color: var(--magenta); border: 1.5px solid rgba(255,0,224,0.55);
    background: rgba(255,0,224,0.04);
  }
  .btn-ghost:hover { background: rgba(255,0,224,0.12); box-shadow: 0 0 26px rgba(255,0,224,0.35); transform: translateY(-3px); }

  /* ===== 终端 ===== */
  .term-wrap { max-width: 880px; margin: 26px auto 0; }
  .term {
    border: 1px solid rgba(0,240,255,0.2); border-radius: 12px; overflow: hidden;
    background: var(--panel); text-align: left;
    box-shadow: 0 0 44px rgba(0,240,255,0.07), 0 24px 60px rgba(0,0,0,0.5);
  }
  .term-bar {
    display: flex; align-items: center; gap: 8px; padding: 12px 16px;
    background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(0,240,255,0.15);
  }
  .tdot { width: 12px; height: 12px; border-radius: 50%; }
  .tdot.r { background: var(--red); } .tdot.y { background: var(--amber); } .tdot.g { background: var(--green); }
  .term-bar .title {
    margin-left: 12px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dim); letter-spacing: 1px;
  }
  .term-bar .badge { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--green); }
  .term-body {
    display: flex; flex-direction: column;
    font-family: 'JetBrains Mono', 'Noto Sans Mono CJK SC', monospace; font-size: 13.5px; line-height: 1.9;
  }
  .term-out {
    padding: 20px 22px; min-height: 320px; max-height: 440px; overflow-y: auto;
  }
  .term-line { white-space: pre-wrap; word-break: break-word; }
  .t-prompt { color: var(--green); }
  .t-cmd { color: #fff; }
  .t-ok { color: var(--green); }
  .t-warn { color: var(--amber); }
  .t-info { color: var(--cyan); }
  .t-err { color: var(--magenta); }
  .t-dim { color: var(--dim); }
  .t-link { color: var(--cyan); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .t-link:hover { color: var(--magenta); }
  .term-input-line {
    display: flex; align-items: center; gap: 6px;
    padding: 10px 22px; border-top: 1px solid rgba(0,240,255,0.12); background: rgba(255,255,255,0.02);
  }
  .term-input-line input {
    flex: 1; background: transparent; border: none; outline: none; color: #fff;
    font-family: 'JetBrains Mono', monospace; font-size: 13.5px; caret-color: var(--green); min-width: 0;
  }

  /* ===== 作品墙 ===== */
  .projects { padding: 70px 0 30px; }
  .section-head { text-align: center; margin-bottom: 40px; }
  .section-head .label {
    font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 4px;
    color: var(--magenta); text-transform: uppercase; text-shadow: 0 0 12px rgba(255,0,224,0.5);
  }
  .section-head h2 {
    font-family: 'Orbitron', 'Noto Sans SC', sans-serif; font-weight: 700;
    font-size: clamp(26px, 4vw, 38px); margin-top: 10px; letter-spacing: 1px;
  }
  .grid-cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 22px; }
  .card {
    position: relative; padding: 28px 26px; border-radius: 12px; text-decoration: none; color: var(--text);
    background: rgba(18,18,32,0.72); border: 1px solid rgba(255,255,255,0.08);
    transition: transform 0.3s, box-shadow 0.3s, border-color 0.3s;
    display: flex; flex-direction: column; overflow: hidden;
    flex: 1 1 300px; max-width: 400px;
  }
  .card::before {
    content: ''; position: absolute; inset: -2px; border-radius: 13px; z-index: -1; opacity: 0; transition: opacity 0.3s;
  }
  .card:hover { transform: translateY(-6px); }
  .card:hover::before {
    background: linear-gradient(135deg, rgba(0,240,255,0.5), transparent 40%, rgba(255,0,224,0.5));
    filter: blur(14px); opacity: 1;
  }
  .card.coming { opacity: 0.55; border-style: dashed; cursor: default; }
  .card.coming:hover { transform: none; }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .card-num { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dim); letter-spacing: 1px; }
  .card-status {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 999px; border: 1px solid;
  }
  .st-live { color: var(--green); border-color: rgba(51,255,119,0.5); text-shadow: 0 0 8px rgba(51,255,119,0.5); }
  .st-coming { color: var(--amber); border-color: rgba(255,189,46,0.5); }
  .card h3 { font-family: 'Orbitron', 'Noto Sans SC', sans-serif; font-size: 19px; font-weight: 700; letter-spacing: 1px; margin-bottom: 8px; }
  .card .tagline { font-size: 13px; color: var(--cyan); margin-bottom: 12px; }
  .card.coming .tagline { color: var(--dim); }
  .card p { font-size: 13px; color: var(--muted); font-weight: 300; line-height: 1.85; flex: 1; }
  .card-tags { margin-top: 18px; display: flex; gap: 8px; flex-wrap: wrap; }
  .card-tags span {
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: 0.5px;
    color: var(--muted); border: 1px solid rgba(255,255,255,0.12); padding: 3px 9px; border-radius: 5px;
  }
  .card .go {
    margin-top: 20px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--magenta);
    letter-spacing: 1px;
  }
  .card.coming .go { color: var(--dim); }

  /* ===== 联系方式条 ===== */
  .contact {
    margin: 50px 0 30px; padding: 34px 30px; text-align: center; border-radius: 14px;
    background: rgba(18,18,32,0.6); border: 1px dashed rgba(255,0,224,0.3);
  }
  .contact .prompt { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dim); letter-spacing: 2px; margin-bottom: 16px; }
  .contact .links { display: flex; justify-content: center; gap: 26px; flex-wrap: wrap; }
  .contact .links a {
    font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--muted); text-decoration: none;
    transition: all 0.25s;
  }
  .contact .links a:hover { color: var(--cyan); text-shadow: 0 0 12px rgba(0,240,255,0.5); }

  footer {
    text-align: center; padding: 26px 6vw 40px; font-size: 12px; letter-spacing: 2px;
    color: var(--dim); font-family: 'JetBrains Mono', monospace;
    border-top: 1px solid rgba(255,0,224,0.1);
  }
  footer .sep { color: var(--magenta); }

  @media (max-width: 600px) {
    .grid-cards { flex-direction: column; align-items: stretch; }
    .card { max-width: none; }
    .nav { justify-content: center; text-align: center; }
    .term-out { padding: 14px 14px; font-size: 12px; min-height: 240px; }
    .term-input-line { padding: 8px 14px; }
    .term-input-line input { font-size: 12px; }
    .cta-row { flex-direction: column; width: 100%; }
    .btn { width: 100%; text-align: center; }
  }
</style>
</head>
<body class="scanlines">
<div class="grid-bg"></div>
<div class="glow-orbs"></div>
<canvas id="dust"></canvas>

<div class="wrap">
  <nav class="nav">
    <div class="logo"><span class="c1">&lt;</span>AAA·<span class="c2">huan</span><span class="c1">/&gt;</span></div>
    <div class="nav-links">
      <a href="#top"><span class="tilda">~/</span>home</a>
      <a href="#terminal"><span class="tilda">~/</span>terminal</a>
      <a href="#projects"><span class="tilda">~/</span>projects</a>
      <a href="#contact"><span class="tilda">~/</span>contact</a>
    </div>
  </nav>

  <main>
    <section class="hero" id="top">
      <div class="eyebrow">~/hello/world</div>
      <h1>HELLO,<br>WORLD.</h1>
      <p class="sub">
        我是 <span class="hl">AAA·huan</span>，一名前端工程师与<span class="hl2">生成艺术</span>爱好者。
        这里是<b>我的实验仓库</b>—— 一些小实验、小作品，正在这里生长。
      </p>
      <div class="cta-row">
        <a class="btn btn-solid" href="#projects">进入作品集 →</a>
        <a class="btn btn-ghost" href="#terminal">打开终端</a>
      </div>

      <!-- 可交互终端 -->
      <div class="term-wrap" id="terminal">
        <div class="term">
          <div class="term-bar">
            <span class="tdot r"></span><span class="tdot y"></span><span class="tdot g"></span>
            <span class="title">huan@main: ~</span>
            <span class="badge">● bash</span>
          </div>
          <div class="term-body" id="termBody">
            <div class="term-out" id="termOut"></div>
            <div class="term-input-line">
              <span class="t-prompt">huan@main: ~$ </span>
              <input id="termInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="终端命令">
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="projects" id="projects">
      <div class="section-head">
        <div class="label">// ls ./projects</div>
        <h2>实验仓库</h2>
      </div>
      <div class="grid-cards" id="projectGrid"></div>
    </section>

    <section class="contact" id="contact">
      <div class="prompt">$ echo "say hi"</div>
      <div class="links" id="contactLinks"></div>
    </section>
  </main>

  <footer>AAA·huan <span class="sep">◆</span> 实验仓库 <span class="sep">|</span> EST 2026</footer>
</div>

<script>
/* =====================================================================
 * 个人化配置 —— 身份信息与作品列表
 * 在这里修改即可：加一条作品 = 在 PROJECTS 数组里加一个对象，
 * 终端 `ls` 输出与下方卡片墙会自动同步，无需改动其它代码。
 * ================================================================== */
var CONFIG = {
  name: 'AAA·huan',
  role: '前端工程师 / 生成艺术爱好者',
  intro: '我是 AAA·huan，前端工程师与生成艺术爱好者。这里是实验仓库：配色工具、生成艺术、各种小玩意儿。',
  github: 'https://github.com/AAA-huan',       // TODO: 换成你的 GitHub
  email: '2767151990@qq.com',                  // TODO: 换成你的邮箱
  emailHref: 'mailto:2767151990@qq.com',       // TODO: 同上
  cursor: 'huan@main: ~$'
};

/* 作品列表：status 为 'live' 表示已上线（href 需有效），'coming' 表示构建中 */
var PROJECTS = [
  {
    title: 'PaletteCraft',
    tagline: '智能配色生成器',
    desc: '从一粒主色出发，算法生成和谐配色；上传图片即可提取灵魂主色。HSV 色相数学 + K-Means 聚类，秩序从色环中涌现。',
    tags: ['Flask', 'Pillow', 'K-Means', 'HSV'],
    href: '/go_palette',
    status: 'live'
  },
  {
    title: '下一个实验',
    tagline: 'TO BE CONTINUED',
    desc: '实验仓库持续生长中。新作品将在这里安家——给它一个名字，它就长成一个小世界。',
    tags: ['WIP', 'Soon'],
    href: '#',            // TODO: 作品上线后替换为真实路由
    status: 'coming'
  }
];

/* ============ 工具函数 ============ */
function $el(id) { return document.getElementById(id); }

function appendLine(html, cls) {
  var out = $el('termOut');
  var div = document.createElement('div');
  div.className = 'term-line' + (cls ? ' ' + cls : '');
  div.innerHTML = html;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
  return div;
}

function cmdLine(cmd) {
  appendLine('<span class="t-prompt">' + CONFIG.cursor + ' </span><span class="t-cmd">' + escapeHtml(cmd) + '</span>');
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ============ 终端命令 ============ */
var COMMANDS = ['help', 'whoami', 'ls', 'open', 'contact', 'clear', 'palette'];

function printHelp() {
  appendLine('<span class="t-info">可用命令：</span>');
  appendLine('  <span class="t-cmd">whoami</span>     <span class="t-dim">查看我的介绍</span>');
  appendLine('  <span class="t-cmd">ls</span>         <span class="t-dim">列出实验仓库的作品</span>');
  appendLine('  <span class="t-cmd">open &lt;编号&gt;</span>  <span class="t-dim">打开某个作品（如 open 1）</span>');
  appendLine('  <span class="t-cmd">palette</span>    <span class="t-dim">直接进入 PaletteCraft 配色工具</span>');
  appendLine('  <span class="t-cmd">contact</span>    <span class="t-dim">查看联系方式</span>');
  appendLine('  <span class="t-cmd">clear</span>      <span class="t-dim">清空终端</span>');
}

function printWhoami() {
  appendLine('<span class="t-info">' + escapeHtml(CONFIG.intro) + '</span>');
  appendLine('  <span class="t-dim">role:</span> <span class="t-ok">' + escapeHtml(CONFIG.role) + '</span>');
  appendLine('  <span class="t-dim">输入</span> <span class="t-warn">ls</span> <span class="t-dim">查看作品，或</span> <span class="t-warn">help</span> <span class="t-dim">查看全部命令</span>');
}

function projectRow(p, i) {
  var idx = String(i + 1).padStart(2, '0');
  var live = p.status === 'live';
  var status = live ? '<span class="t-ok">● live</span>' : '<span class="t-warn">▲ coming</span>';
  var link = live
    ? '  <span class="t-link" data-open="' + i + '">进入 →</span>'
    : '  <span class="t-dim">敬请期待</span>';
  return '  ' + idx + '. <span class="t-cmd">' + escapeHtml(p.title) + '</span>'
    + ' <span class="t-dim">—</span> ' + escapeHtml(p.tagline)
    + ' ' + status + link;
}

function printProjects() {
  appendLine('<span class="t-info">./projects — 共 ' + PROJECTS.length + ' 个条目</span>');
  PROJECTS.forEach(function (p, i) { appendLine(projectRow(p, i)); });
  appendLine('<span class="t-dim">输入 open &lt;编号&gt; 打开作品</span>');
}

function printContact() {
  appendLine('  <span class="t-dim">github:</span> <span class="t-info">' + escapeHtml(CONFIG.github) + '</span>');
  appendLine('  <span class="t-dim">email:</span>  <span class="t-info">' + escapeHtml(CONFIG.email) + '</span>');
  appendLine('  <span class="t-dim">欢迎来信交流 ✉</span>');
}

function openProject(i) {
  var p = PROJECTS[i];
  if (!p) {
    appendLine('<span class="t-err">error: 编号 ' + i + ' 不存在，用 ls 查看有效编号</span>');
    return;
  }
  if (p.status !== 'live' || !p.href || p.href === '#') {
    appendLine('<span class="t-warn">' + escapeHtml(p.title) + ' 还在构建中，敬请期待 ✦</span>');
    return;
  }
  appendLine('<span class="t-ok">opening ' + escapeHtml(p.href) + ' ...</span>');
  window.location.href = p.href;
}

function handleCommand(raw) {
  var input = String(raw || '').trim();
  if (!input) return;
  cmdLine(input);

  var parts = input.split(/\s+/);
  var cmd = parts[0].toLowerCase();
  var arg = parts[1];

  switch (cmd) {
    case 'help': printHelp(); break;
    case 'whoami': case 'who': printWhoami(); break;
    case 'ls': case 'projects': case 'lsprojects': printProjects(); break;
    case 'open': case 'go': openProject(parseInt(arg, 10) - 1); break;
    case 'palette': case 'palettecraft':
      appendLine('<span class="t-ok">opening /go_palette ...</span>');
      window.location.href = '/go_palette';
      break;
    case 'contact': case 'email': printContact(); break;
    case 'clear': $el('termOut').innerHTML = ''; break;
    case 'sudo':
      appendLine('<span class="t-warn">permission denied: 这就是我的地盘</span>');
      break;
    default:
      appendLine('<span class="t-err">bash: ' + escapeHtml(cmd) + ': command not found</span>');
      appendLine('<span class="t-dim">输入 help 查看可用命令</span>');
  }
}

/* ============ 启动 boot 序列 ============ */
function boot() {
  var bootLines = [
    '<span class="t-dim">booting experiment-repo v0.1.0 ...</span>',
    '<span class="t-dim">loading modules</span> <span class="t-ok">[3/3 OK]</span>',
    '<span class="t-dim">init shell environment</span> <span class="t-ok">[OK]</span>'
  ];
  var i = 0;
  var iv = setInterval(function () {
    appendLine(bootLines[i]);
    i++;
    if (i >= bootLines.length) {
      clearInterval(iv);
      setTimeout(function () {
        cmdLine('whoami');
        printWhoami();
        appendLine('<span class="t-dim">输入 help 查看可用命令，点击下方链接可打开作品</span>');
        var inp = $el('termInput');
        if (inp) inp.focus();
      }, 150);
    }
  }, 200);
}

/* ============ 输入交互 ============ */
var cmdHistory = [], histIdx = -1;

function initTerminal() {
  var input = $el('termInput');
  if (!input) return;
  input.addEventListener('keydown', function (e) {
    var isEnter = e.key === 'Enter' || e.keyCode === 13;
    if (isEnter) {
      var v = input.value;
      input.value = '';
      cmdHistory.push(v); histIdx = cmdHistory.length;
      handleCommand(v);
    } else if (e.key === 'ArrowUp' || e.keyCode === 38) {
      if (histIdx > 0) { histIdx--; input.value = cmdHistory[histIdx] || ''; }
      e.preventDefault();
    } else if (e.key === 'ArrowDown' || e.keyCode === 40) {
      if (histIdx < cmdHistory.length - 1) { histIdx++; input.value = cmdHistory[histIdx]; }
      else { histIdx = cmdHistory.length; input.value = ''; }
      e.preventDefault();
    } else if (e.key === 'Tab' || e.keyCode === 9) {
      e.preventDefault();
      var cur = input.value.split(/\s+/)[0].toLowerCase();
      var match = COMMANDS.filter(function (c) { return c.indexOf(cur) === 0; })[0];
      if (match) input.value = match;
    }
  });
  var body = $el('termBody');
  if (body) {
    body.addEventListener('click', function (e) {
      var t = e.target;
      if (t && t.dataset && t.dataset.open !== undefined) openProject(parseInt(t.dataset.open, 10));
      input.focus();
    });
  }
}

/* ============ 作品墙渲染 ============ */
function renderProjects() {
  var grid = $el('projectGrid');
  grid.innerHTML = PROJECTS.map(function (p, i) {
    var live = p.status === 'live';
    var cls = live ? 'card' : 'card coming';
    var status = live
      ? '<span class="card-status st-live">● LIVE</span>'
      : '<span class="card-status st-coming">▲ BUILDING</span>';
    var go = live
      ? '<div class="go">进入 → <span class="t-dim">/go_palette</span></div>'
      : '<div class="go">敬请期待</div>';
    var tags = p.tags.map(function (t) { return '<span>' + escapeHtml(t) + '</span>'; }).join('');
    var href = live ? (p.href || '#') : '#';
    return '<a class="' + cls + '" href="' + href + '"' + (live ? '' : ' onclick="return false"') + '>'
      + '<div class="card-top"><span class="card-num">/' + String(i + 1).padStart(2, '0') + '</span>' + status + '</div>'
      + '<h3>' + escapeHtml(p.title) + '</h3>'
      + '<div class="tagline">' + escapeHtml(p.tagline) + '</div>'
      + '<p>' + escapeHtml(p.desc) + '</p>'
      + '<div class="card-tags">' + tags + '</div>'
      + go
      + '</a>';
  }).join('');
}

function renderContact() {
  $el('contactLinks').innerHTML =
    '<a href="' + escapeHtml(CONFIG.github) + '" target="_blank" rel="noopener">[github] ' + escapeHtml(CONFIG.github) + '</a>'
    + '<a href="' + escapeHtml(CONFIG.emailHref) + '">[email] ' + escapeHtml(CONFIG.email) + '</a>';
}

/* ============ 灰尘粒子背景 ============ */
function initDust() {
  var canvas = $el('dust');
  var ctx = canvas.getContext('2d');
  var W, H, dots = [], N = 42;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);
  for (var i = 0; i < N; i++) {
    dots.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.25, vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 1.6 + 0.4, cyan: Math.random() < 0.5
    });
  }
  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < N; i++) {
      var d = dots[i];
      d.x += d.vx; d.y += d.vy;
      if (d.x < 0 || d.x > W) d.vx *= -1;
      if (d.y < 0 || d.y > H) d.vy *= -1;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx.fillStyle = d.cyan ? 'rgba(0,240,255,0.5)' : 'rgba(255,0,224,0.5)';
      ctx.fill();
    }
    requestAnimationFrame(tick);
  }
  tick();
}

/* ============ 初始化 ============ */
function initErrorHandler() {
  window.addEventListener('error', function (e) {
    var msg = (e.message || 'unknown error') + (e.lineno ? ' (line ' + e.lineno + ')' : '');
    appendLine('<span class="t-err">[runtime error] ' + escapeHtml(msg) + '</span>');
  });
  window.addEventListener('unhandledrejection', function (e) {
    appendLine('<span class="t-err">[promise rejection] ' + escapeHtml(String(e.reason || e)) + '</span>');
  });
}

document.addEventListener('DOMContentLoaded', function () {
  initErrorHandler();
  boot();
  initTerminal();
  renderProjects();
  renderContact();
  initDust();
});
</script>
